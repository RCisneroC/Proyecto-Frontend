<div class="addContainer">
  <div class="modalHeader">
      <div class="editRowModal">
          <div class="modalHeader clearfix">
              <div class="modal-about">
                  {{dialogTitle +"("+data.teacher.name+" " +data.teacher.lastName+")"}}
              </div>
          </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
          <mat-icon>close</mat-icon>
      </button>
  </div>
  <div mat-dialog-content>

      <form class="register-form m-4" [formGroup]="EvalForm" (ngSubmit)="submit">

          <div class="row clearfix">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="card">
                      <div class="row">
                          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                              <mat-form-field class="example-full-width" appearance="outline">
                                  <mat-label>Puntuación del 1 al 10</mat-label>
                                  <input appOnlyNumber matInput maxlength="2"  formControlName="evaluation">
                                  <mat-error *ngIf="EvalForm.get('evaluation')?.hasError('required')">
                                     La evaluación es requerida
                                  </mat-error>
                                  <mat-error *ngIf="EvalForm.get('evaluation')?.hasError('min')">
                                    Mínimo 1
                                 </mat-error>
                                 <mat-error *ngIf="EvalForm.get('evaluation')?.hasError('max')">
                                  Máximo 10
                               </mat-error>
                              </mat-form-field>
                          </div>
                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-3">
                          <mat-form-field class="example-full-width" appearance="fill">
                              <mat-label>Comentario</mat-label>
                              <textarea matInput formControlName="commentEvaluation"></textarea>
                              <mat-error *ngIf="EvalForm.get('commentEvaluation')?.hasError('required')">
                                  El comentario es requerido
                              </mat-error>
                          </mat-form-field>
                      </div>

                      </div>
                  </div>
              </div>
              <button mat-raised-button color="primary" [disabled]="!EvalForm.valid"
                  (click)="submit()">Guardar</button>
          </div>
      </form>
  </div>
</div>
