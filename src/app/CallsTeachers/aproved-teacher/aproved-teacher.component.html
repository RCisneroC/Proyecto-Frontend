<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle +"("+data.teacher.name+" " +data.teacher.lastName+")"}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>

        <form class="register-form m-4" [formGroup]="ApprovedForm">

            <div class="row clearfix">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="row">


                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                <mat-form-field class="example-full-width" appearance="outline">
                                    <mat-label>Estado</mat-label>
                                    <mat-select formControlName="statusId" (selectionChange)="Valor($event.value)">
                                        <mat-option value="">Seleccione</mat-option>
                                        <mat-option value="1">Aprobar</mat-option>
                                        <mat-option value="2">Rechazar</mat-option>
                                        <mat-option *ngIf="data.teacher.statusId===1" value="3">Dar de baja</mat-option>
                                    </mat-select>
                                    <mat-error *ngIf="ApprovedForm.get('statusId')?.hasError('required')">
                                        la Estado es requerido
                                    </mat-error>
                                </mat-form-field>

                            </div>



                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                <mat-form-field class="example-full-width" appearance="outline">
                                    <mat-label>Proceso</mat-label>
                                    <mat-select formControlName="process">
                                        <mat-option *ngFor="let grado of processList"
                                            [value]="grado.id">{{grado.name}}</mat-option>
                                    </mat-select>
                                    <mat-error *ngIf="ApprovedForm.get('process')?.hasError('required')">
                                        El proceso es requerido
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div *ngIf="isCalls" class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                <mat-form-field class="example-full-width" appearance="outline">
                                    <mat-label>Tipo de Contratación</mat-label>
                                    <mat-select formControlName="contractType">
                                        <mat-option *ngFor="let row of contractTypeList"
                                            [value]="row.id">{{row.name}}</mat-option>
                                    </mat-select>
                                    <mat-error *ngIf="ApprovedForm.get('contractType')?.hasError('required')">
                                        El Tipo de Contratación es requerido
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-3">
                                <mat-form-field class="example-full-width" appearance="fill">
                                    <mat-label>Comentario</mat-label>
                                    <textarea matInput formControlName="approvalMessage"></textarea>
                                    <mat-error *ngIf="ApprovedForm.get('approvalMessage')?.hasError('required')">
                                        El comentario es requerido
                                    </mat-error>
                                </mat-form-field>
                            </div>

                        </div>
                    </div>
                </div>
                <button mat-raised-button color="primary" type="button" (click)="submit()">Guardar</button>
            </div>
        </form>
    </div>
</div>
