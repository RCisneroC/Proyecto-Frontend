<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          Editar Convocatoria Docente #{{data.id}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="form">
      <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-6">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Título</mat-label>
            <textarea matInput maxlength="255"  cdkTextareaAutosize #autosize="cdkTextareaAutosize"
            cdkAutosizeMinRows="2" cdkAutosizeMaxRows="4"
            formControlName="titulo"></textarea>
            <mat-error *ngIf="form.get('titulo')?.hasError('required')">
               es requerido
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Proceso</mat-label>
            <mat-select formControlName="proceso">
              <mat-option [value]="1">Entrenamiento</mat-option>
              <mat-option [value]="2">Formación Especializada</mat-option>
              <mat-option [value]="3">Ambas</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('proceso')?.hasError">Seleccione el proceso</mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-4">
          <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Fecha de Inicio </mat-label>
              <input matInput [matDatepicker]="pickerStart1" formControlName="fechaInicio">
              <mat-datepicker-toggle matSuffix [for]="pickerStart1"></mat-datepicker-toggle>
              <mat-datepicker #pickerStart1></mat-datepicker>
              <mat-error *ngIf="form.get('fechaInicio')?.hasError('required')">
                Selecciones una fecha de Inicio
              </mat-error>
            </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-4">
          <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Fecha de Fin </mat-label>
              <input matInput [matDatepicker]="pickerStart2" formControlName="fechaFin">
              <mat-datepicker-toggle matSuffix [for]="pickerStart2"></mat-datepicker-toggle>
              <mat-datepicker #pickerStart2></mat-datepicker>
              <mat-error *ngIf="form.get('fechaFin')?.hasError('required')">
                Selecciones una fecha de fin
              </mat-error>
            </mat-form-field>
        </div>
      </div>
        <div class="row">
          <div class="col-lg-6 col-md-6 col-xs-12 col-12">
            <mat-label><strong>Descripción</strong></mat-label>
            <ckeditor [config]="config" formControlName="descripcion" [editor]="Editor">
            </ckeditor>
          </div>
          <div class="col-lg-6 col-md-6 col-xs-12 col-12">
            <mat-label><strong>Funciones</strong></mat-label>
            <ckeditor  [config]="config" formControlName="funciones" [editor]="Editor">
            </ckeditor>
          </div>
      </div>
      <div class="row" style="margin-top:25px;">
        <div class="col-lg-6 col-md-6 col-xs-12 col-12">
          <mat-label><strong>Requisitos</strong></mat-label>
          <ckeditor [config]="config" formControlName="requisitos" [editor]="Editor">
          </ckeditor>
        </div>
      </div>
      <div class="row" style="margin-top:25px;">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
            <div class="example-button-row">
              <button mat-raised-button color="primary" [disabled]="!form.valid"
                (click)="save()">Guardar</button>
              <button mat-raised-button color="warn" (click)="close()" tabindex="-1">Cancelar</button>
            </div>
          </div>
        </div>
    </form>
  </div>
</div>
