<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Historial asignatura'" [items]="['Inicio','Historial Docente']"
        [active_item]="'Historial asignatura'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix" style="margin-bottom: 20px;text-align: right;">
      <div class="">
        <button matTooltip="Regresar" mat-raised-button color="accent" (click)="volverAtras()">
          <mat-icon>keyboard_backspace</mat-icon> Regresar
        </button>
      </div>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">

          <div class="header">
            <h2 class="text-uppercase"><strong>Historial Asignaturas</strong></h2>
          </div>
          <div class="body">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                  <div class="materialTableHeader">
                    <div class="left">
                      <ul class="header-buttons-left ms-0">
                        <li class="tbl-title">
                          <h2>Docentes</h2>
                        </li>
                        <li class="tbl-search-box">
                          <label for="search-input"><i class="material-icons search-icon">search</i></label>
                          <input placeholder="Buscar" type="text" #filter class="browser-default search-field"
                            aria-label="Search box">
                        </li>
                      </ul>
                    </div>
                    <div class="right">
                      <ul class="tbl-export-btn">
                        <li>
                          <div class="export-button m-l-10" matTooltip="XLSX">
                            <img src="assets/images/icons/xlsx.png" alt="" />
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>
                  <div class="body overflow-auto">
                    <div class="responsive_table">
                      <table mat-table [dataSource]="DataSubjects" matSort class="mat-cell advance-table">

                        <ng-container matColumnDef="name">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Asignatura
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">Asignatura:</span>{{row.subjectName}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="numOfCredits">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Creditos
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">Creditos:</span>{{row.subjectNumOfCredits}}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="numOfHours">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Año
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">Año:</span>{{row.year}}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="numOfClasses">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Periodo
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">Periodo:</span>{{row.periodId}}</mat-cell>
                        </ng-container>


                        <ng-container matColumnDef="hasLaboratory">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Laboratorio
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span
                              class="mobile-label">Laboratorio:</span>{{row.subjectHasLaboratory===true?"Si":"No"}}</mat-cell>
                        </ng-container>

                        <!-- actions -->
                        <ng-container matColumnDef="actions">
                          <mat-header-cell class="pr-0" *matHeaderCellDef>Acciones</mat-header-cell>
                          <mat-cell *matCellDef="let row; let i=index;" class="pr-0">


                            <button *ngIf="typeUser === 'Profesor' || typeUser === 'Administrador'" mat-mini-fab
                              color="primary" matTooltip="Ver Detalle" (click)="$event.stopPropagation()"
                              (click)="Detail(row)" class="tbl-action-btn">
                              <mat-icon>remove_red_eye</mat-icon>

                            </button>
                            <button *ngIf="typeUser === 'Profesor' || typeUser === 'Administrador'" mat-mini-fab
                              color="primary" (click)="$event.stopPropagation()" matTooltip="Ingresar Asistencia"
                              (click)="calificacionesAasignatura(row)" class="tbl-action-btn">
                              <mat-icon>dvr</mat-icon>
                            </button>
                            <button *ngIf="typeUser === 'Profesor' || typeUser === 'Administrador'" mat-mini-fab
                              color="primary" (click)="$event.stopPropagation()" matTooltip="Encuesta"
                              (click)="sendEncuestaSubject(row)" class="tbl-action-btn">
                              <mat-icon>file_copy</mat-icon>
                            </button>
                            <button *ngIf="typeUser === 'Profesor' || typeUser === 'Administrador'" mat-mini-fab
                              color="accent" (click)="$event.stopPropagation()" matTooltip="Calificación Final"
                              (click)="calificacionFinalSubject(row)" class="tbl-action-btn">
                              <mat-icon>av_timer</mat-icon>

                            </button>



                          </mat-cell>
                        </ng-container>

                        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: displayedColumns;" [style.cursor]="'pointer'" matRipple>
                        </mat-row>
                      </table>


                    </div>
                    <!-- Loading spinner -->
                    <!-- <div *ngIf="exampleDatabase?.isTblLoading" class="tbl-spinner">
                            <mat-progress-spinner color="primary" [diameter]="40" mode="indeterminate">
                            </mat-progress-spinner>
                          </div> -->
                    <!-- context menu start -->
                    <!-- <div style="visibility: hidden; position: fixed" [style.left]="contextMenuPosition.x"
                            [style.top]="contextMenuPosition.y" [matMenuTriggerFor]="contextMenu">
                          </div> -->



                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
