<section class="content">
    <div class="content-block">
      <div class="block-header">
        <!-- breadcrumb -->
        <app-breadcrumb [title]="'Historial Docente'" [items]="['Home','Gestión Docente']" [active_item]="'Historial docente'">
        </app-breadcrumb>
      </div>
      <div class="row clearfix">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <div class="card">
            <div class="header">
              <h2><strong>Historial docentes</strong></h2>
            </div>
            <div class="body">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <div class="card">
                        <div class="materialTableHeader">
                          <div class="left">
                            <ul class="header-buttons-left ms-0">
                              <li class="tbl-title">
                                <h2>Docentes</h2>
                              </li>
                              <li class="tbl-search-box">
                                <label for="search-input"><i class="material-icons search-icon">search</i></label>
                                <input placeholder="Buscar" type="text" #filter class="browser-default search-field"
                                  aria-label="Search box">
                              </li>
                            </ul>
                          </div>
                          <div class="right">
                            <ul class="tbl-export-btn">
                          
                           
                              <li>
                                <div class="export-button m-l-10" matTooltip="XLSX">
                                  <img src="assets/images/icons/xlsx.png" alt=""  />
                                </div>
                              </li>
                            </ul>
                          </div>
                        </div>
                        <div class="body overflow-auto">
                          <div class="responsive_table">
                            <table mat-table [dataSource]="DataSubjects" matSort class="mat-cell advance-table">
                            
                            
                              <ng-container matColumnDef="name">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>Asignatura
                                </mat-header-cell>
                                <mat-cell *matCellDef="let row">
                                  <span class="mobile-label">Asignatura:</span>{{row.name}}</mat-cell>
                              </ng-container>
                              <ng-container matColumnDef="numOfCredits">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>Creditos
                                </mat-header-cell>
                                <mat-cell *matCellDef="let row">
                                  <span class="mobile-label">Creditos:</span>{{row.numOfCredits}}</mat-cell>
                              </ng-container>
                          
   
                              <ng-container matColumnDef="numOfHours">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>Horas
                                </mat-header-cell>
                                <mat-cell *matCellDef="let row" >
                                  <span class="mobile-label">Horas:</span>{{row.numOfHours}}</mat-cell>
                              </ng-container>
                              
                              <ng-container matColumnDef="numOfClasses">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>clases
                                </mat-header-cell>
                                <mat-cell *matCellDef="let row" >
                                  <span class="mobile-label">clases:</span>{{row.numOfClasses}}</mat-cell>
                              </ng-container>
                              
                                 
                              <ng-container matColumnDef="hasLaboratory">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>Laboratorio
                                </mat-header-cell>
                                <mat-cell *matCellDef="let row" >
                                  <span class="mobile-label">Laboratorio:</span>{{row.hasLaboratory===true?"Si":"No"}}</mat-cell>
                              </ng-container>
                              
                          
                              

                              
                         
                             
                             
        
                              <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                              <mat-row *matRowDef="let row; columns: displayedColumns;"
                                [style.cursor]="'pointer'" matRipple>
                              </mat-row>
                            </table>
                          </div>
                          <!-- Loading spinner -->
                          <!-- <div *ngIf="exampleDatabase?.isTblLoading" class="tbl-spinner">
                            <mat-progress-spinner color="primary" [diameter]="40" mode="indeterminate">
                            </mat-progress-spinner>
                          </div> -->
                          <!-- context menu start -->
                          <!-- <div style="visibility: hidden; position: fixed" [style.left]="contextMenuPosition.x"
                            [style.top]="contextMenuPosition.y" [matMenuTriggerFor]="contextMenu">
                          </div> -->
                        
                  
                   
                        </div>
                      </div>
                    </div>
                  </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
