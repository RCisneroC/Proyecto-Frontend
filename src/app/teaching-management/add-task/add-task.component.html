<div class="addContainer">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">

          <div class="modal-about">
            {{dialogTitle}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
      <form class="register-form m-4" [formGroup]="trainingForm" (ngSubmit)="submit">
        <div class="row">
   
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Titulo</mat-label>
              <textarea matInput    cdkTextareaAutosize #autosize="cdkTextareaAutosize"
              cdkAutosizeMinRows="2" cdkAutosizeMaxRows="4"
           
              formControlName="titulo">
          </textarea>
          <mat-error *ngIf="trainingForm.get('titulo')?.hasError('required')">
            es requerido
         </mat-error>
            </mat-form-field>
          </div>
        </div>
    
          <div class="row">
         
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Observacion</mat-label>
              <textarea matInput    cdkTextareaAutosize #autosize="cdkTextareaAutosize"
              cdkAutosizeMinRows="2" cdkAutosizeMaxRows="4"
           
              formControlName="observacion">
          </textarea>
          <mat-error *ngIf="trainingForm.get('observacion')?.hasError('required')">
            es requerido
         </mat-error>
            </mat-form-field>
          </div>
        </div>
     
          <div class="row">
           
              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-6">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Tipo de tarea</mat-label>
             
                  <mat-select formControlName="tipoTarea" >
                    <mat-option *ngFor="let grado of gradosInstruccion"  [value]="grado.nombre">{{grado.nombre}}</mat-option>
                  </mat-select>
                  
                  <mat-error *ngIf="trainingForm.get('tipoTarea')?.hasError('required')">
                     es requerido
                  </mat-error>
                </mat-form-field>
              </div>
              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-6">
                <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Fecha de entrega </mat-label>
                    <input matInput [matDatepicker]="pickerStart1" formControlName="fechaEntrega">
                    <mat-datepicker-toggle matSuffix [for]="pickerStart1"></mat-datepicker-toggle>
                    <mat-datepicker #pickerStart1></mat-datepicker>
                    <mat-error *ngIf="trainingForm.get('fechaEntrega')?.hasError('required')">
                      Selecciones una fecha
                    </mat-error>
                  </mat-form-field>
              </div>
          
            </div>
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>nombre</mat-label>
                  <textarea matInput    cdkTextareaAutosize #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2" cdkAutosizeMaxRows="4"
               
                  formControlName="nombre">
              </textarea>
              <mat-error *ngIf="trainingForm.get('nombre')?.hasError('required')">
                es requerido
             </mat-error>
                </mat-form-field>
              </div>
            </div>
        
          
         
         
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
              <div class="example-button-row">
                <button mat-raised-button color="primary" [disabled]="!trainingForm.valid" 
                  (click)="confirmAdd()">Guardar</button>
                <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
              </div>
            </div>
          </div>
      </form>
    </div>
  </div>
