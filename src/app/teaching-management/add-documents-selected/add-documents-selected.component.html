<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{dialogTitle}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form [formGroup]="FormsEFDocument!">
      <ng-template>Documentos</ng-template>
      <div class="row">

        <div *ngFor="let item of DataRequiredDocuments; index as i"
             class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-3">
          <mat-label style="font-weight: bold;">{{ item.name }}</mat-label>
          <app-file-upload (change)="onFileSelected($event,i,item.documentId)"
                           [formControlName]="item.documentId"></app-file-upload>
          <mat-error *ngIf="FormsEFDocument.get(item.documentId.toString())?.hasError('required')">
            es requerido
          </mat-error>
        </div>


      </div>
      <div>



        <button mat-raised-button color="primary"
                [disabled]="!(FormsEFDocument.valid )" (click)="submit()">Guardar
          docente</button>
        <mat-error *ngIf=" FormsEFDocument.valid">
          Por favor verifique que los datos requeridos en los pasos anteriores
          fueron ingresados.
        </mat-error>
      </div>
    </form>

  </div>
</div>
