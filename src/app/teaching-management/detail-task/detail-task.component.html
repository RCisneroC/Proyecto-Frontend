<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Estudiantes'" [items]="['Perfil','Historial Docente']" [active_item]="'Asignatura'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix" style="margin-bottom: 20px;text-align: right;">
      <div class="">
        <button matTooltip="Regresar" mat-raised-button color="accent" (click)="volverAtras()">
          <mat-icon>keyboard_backspace</mat-icon> Regresar
        </button>
      </div>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header">
            <h2 class="text-uppercase"><strong>Listado de Estudiantes</strong></h2>
          </div>
          <div class="body">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                  <div class="materialTableHeader">
                    <div class="left">
                      <ul class="header-buttons-left ms-0">
                        <li class="tbl-title">
                          <h2>Estudiante</h2>
                        </li>
                        <li class="tbl-search-box">
                          <label for="search-input"><i class="material-icons search-icon">search</i></label>
                          <input placeholder="Buscar" type="text" #filter class="browser-default search-field"
                            aria-label="Search box">
                        </li>
                      </ul>
                    </div>
                    <div class="right">
                      <ul class="tbl-export-btn">
                        <li class="tbl-header-btn">
                          <div class="m-l-10" matTooltip="Nuevo">
                            <button mat-mini-fab color="primary" (click)="addNew()">
                              <mat-icon class="col-white">add</mat-icon>
                            </button>
                          </div>
                        </li>
                        <li class="tbl-header-btn">
                          <div class="m-l-10" matTooltip="Recargar">
                            <button mat-mini-fab color="primary" (click)="refresh()">
                              <mat-icon class="col-white">refresh</mat-icon>
                            </button>
                          </div>
                        </li>

                        <li>
                          <div class="export-button m-l-10" matTooltip="XLSX">
                            <img src="assets/images/icons/xlsx.png" alt="" (click)="exportExcel()" />
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>
                  <div class="body overflow-auto">
                    <div class="body table-responsive">
                      <table mat-table [dataSource]="dataSou" class="w-100">

                        <ng-container matColumnDef="cedula">
                          <th mat-header-cell *matHeaderCellDef> Cedula </th>
                          <td mat-cell *matCellDef="let element">{{ element.cedula }} </td>
                        </ng-container>

                        <ng-container matColumnDef="firstName">
                          <th mat-header-cell *matHeaderCellDef> nombre </th>
                          <td mat-cell *matCellDef="let element">{{ element.firstName }} </td>
                        </ng-container>

                        <ng-container matColumnDef="lastName">
                          <th mat-header-cell *matHeaderCellDef> Apellido </th>
                          <td mat-cell *matCellDef="let element">{{ element.lastName }} </td>
                        </ng-container>

                        <ng-container matColumnDef="email">
                          <th mat-header-cell *matHeaderCellDef> Correo Electronico </th>
                          <td mat-cell *matCellDef="let element">{{ element.email }} </td>
                        </ng-container>
                        <ng-container matColumnDef="gender">
                          <th mat-header-cell *matHeaderCellDef> Genero </th>
                          <td mat-cell *matCellDef="let element">{{ element.gender }} </td>
                        </ng-container>

                        <ng-container matColumnDef="calif">
                          <th mat-header-cell *matHeaderCellDef> Calificación </th>
                          <td mat-cell *matCellDef="let element">{{ element.calif }} </td>
                        </ng-container>



                        <ng-container matColumnDef="actions">
                          <th mat-header-cell *matHeaderCellDef> Acción </th>
                          <td mat-cell *matCellDef="let element">
                            <button mat-mini-fab color="accent" matTooltip="detail">
                              <mat-icon>restore_from_trash</mat-icon>
                            </button>
                          </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                      </table>
                    </div>
                    <mat-menu #contextMenu="matMenu">
                      <ng-template matMenuContent let-item="item">
                        <button mat-menu-item (click)="addNew()">
                          <mat-icon>add_box</mat-icon>
                          <span>Add Record</span>
                        </button>
                        <button mat-menu-item (click)="editCall(item)">
                          <mat-icon>create</mat-icon>
                          <span>Edit Record</span>
                        </button>

                        <button mat-menu-item (click)="refresh()">
                          <mat-icon>refresh</mat-icon>
                          <span>Refresh Record</span>
                        </button>
                        <button mat-menu-item disabled>
                          <mat-icon>no_encryption</mat-icon>
                          <span>Disable</span>
                        </button>
                        <button mat-menu-item [matMenuTriggerFor]="nestedmenu">
                          <mat-icon>list_alt</mat-icon>
                          <span> Nested Menu</span>
                        </button>
                      </ng-template>
                    </mat-menu>
                    <mat-menu #nestedmenu="matMenu">
                      <button mat-menu-item>
                        <mat-icon>mail_outline</mat-icon>
                        <span>Item 1</span>
                      </button>
                      <button mat-menu-item>
                        <mat-icon>call</mat-icon>
                        <span>Item 2</span>
                      </button>
                      <button mat-menu-item>
                        <mat-icon>chat</mat-icon>
                        <span>Item 3</span>
                      </button>
                    </mat-menu>
                    <!-- context menu end -->

                    <!-- <mat-paginator #paginator  
                        [pageSizeOptions]="[5, 10, 25, 100]">
                      </mat-paginator> -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
