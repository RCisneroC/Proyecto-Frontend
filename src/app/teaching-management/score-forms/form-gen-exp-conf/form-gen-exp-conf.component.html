<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{dialogTitle}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="_Forms" (ngSubmit)="submit">
      <div class="row">


        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Experiencia Mínima</mat-label>
            <input matInput formControlName="minExperiencia">
            <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
            <mat-error *ngIf="_Forms.get('minExperiencia')?.hasError('required')">
              La Experiencia es requerida
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Experiencia Máxima</mat-label>
            <input matInput formControlName="maxExperiencia">
            <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
            <mat-error *ngIf="_Forms.get('maxExperiencia')?.hasError('required')">
              La Experiencia es requerida
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Intervalo</mat-label>
            <input matInput formControlName="intervaloExp">
            <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
            <mat-error *ngIf="_Forms.get('intervaloExp')?.hasError('required')">
              La Experiencia es requerida
            </mat-error>
          </mat-form-field>
        </div>


      </div>
      <div class="row">
        <div class="card">
          <div class="body table-responsive" *ngIf="Preview">
            <table mat-table [dataSource]="listPreviewgenerated" class="w-100">
              <!-- Id Column -->

              <ng-container matColumnDef="experiencia">
                <th mat-header-cell *matHeaderCellDef>Experiencia </th>
                <td mat-cell *matCellDef="let element"> {{element.experiencia}} </td>
              </ng-container>


              <ng-container matColumnDef="puntos">
                <th mat-header-cell *matHeaderCellDef>Puntos </th>
                <td mat-cell *matCellDef="let element"> {{element.points}} </td>
              </ng-container>


              <tr mat-header-row *matHeaderRowDef="displayedColumnsPreview"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumnsPreview"></tr>
            </table>
            <mat-paginator #paginator [pageSizeOptions]="[2, 10, 20]"
                           showFirstLastButtons></mat-paginator>
          </div>
        </div>

      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary" [disabled]="!_Forms.valid"
                    (click)="generatePreview()">Previsualizar</button>
            <button mat-raised-button color="primary" [disabled]="!_Forms.valid"
                    (click)="confirmAdd()">Guardar</button>
            <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
