<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Puntuaciones'" [items]="['Inicio','Docentes','Puntuaciones']" [active_item]="'Experiencia'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header">
            <h2 class="text-uppercase"><strong>Listado de Puntuaciones por Experiencia</strong></h2>
          </div>
          <div class="body">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                  <div class="materialTableHeader">
                    <div class="left">
                      <ul class="header-buttons-left ms-0">
                        <li class="tbl-title">
                          <h2>Descripción</h2>
                        </li>
                        <li class="tbl-search-box">
                          <label for="search-input"><i
                            class="material-icons search-icon">search</i></label>
                          <input placeholder="Buscar" type="text" #filter
                                 class="browser-default search-field" aria-label="Search box">
                        </li>
                      </ul>
                    </div>
                    <div class="right">
                      <ul class="tbl-export-btn">
                        <li class="tbl-header-btn">
                          <div class="m-l-10" matTooltip="Nuevo">
                            <button mat-mini-fab color="primary" (click)="addNew()">
                              <mat-icon class="col-white">add</mat-icon>
                            </button>
                          </div>
                        </li>
                        <li class="tbl-header-btn">
                          <div class="m-l-10" matTooltip="Recargar">
                            <button mat-mini-fab color="primary" (click)="refresh()">
                              <mat-icon class="col-white">refresh</mat-icon>
                            </button>
                          </div>
                        </li>

                        <li>
                          <div class="export-button m-l-10" matTooltip="XLSX">
                            <img src="assets/images/icons/xlsx.png" alt=""
                                 (click)="exportExcel()" />
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>
                  <div class="body overflow-auto">
                    <div class="responsive_table">
                      <table mat-table [dataSource]="dataSource" matSort
                             class="mat-cell advance-table">


                        <ng-container matColumnDef="description">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Experiencia
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                                                        <span
                                                          class="mobile-label">Experiencia:</span>{{row.experiencia}}</mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="statusId">
                          <mat-header-cell *matHeaderCellDef mat-sort-header>Puntos
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span
                              class="mobile-label">Puntos:</span>{{row.points}}
                          </mat-cell>
                        </ng-container>

                        <!-- actions -->
                        <ng-container matColumnDef="actions">
                          <mat-header-cell class="pr-0"
                                           *matHeaderCellDef>Acciones</mat-header-cell>
                          <mat-cell *matCellDef="let row; let i=index;" class="pr-0">
                            <button mat-mini-fab color="accent"
                                    (click)="$event.stopPropagation()" (click)="editCall(row)"
                                    class="tbl-action-btn">
                              <app-feather-icons [icon]="'edit'"></app-feather-icons>
                            </button>
                            <!-- <button  mat-stroked-button color="primary" (click)="editCall(row)">Reservar</button> -->
                            <!--<button mat-mini-fab color="accent"
                                    (click)="$event.stopPropagation()" (click)="delete(row)"
                                    class="tbl-action-btn">
                              <app-feather-icons [icon]="'trash'"></app-feather-icons>
                            </button>-->
                          </mat-cell>
                        </ng-container>
                        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: displayedColumns;"
                                 [style.cursor]="'pointer'" matRipple>
                        </mat-row>
                      </table>
                    </div>
                    <!-- Loading spinner -->
                    <div *ngIf="exampleDatabase?.isTblLoading" class="tbl-spinner">
                      <mat-progress-spinner color="primary" [diameter]="40" mode="indeterminate">
                      </mat-progress-spinner>
                    </div>
                    <!-- context menu start -->
                    <div style="visibility: hidden; position: fixed"
                         [style.left]="contextMenuPosition.x" [style.top]="contextMenuPosition.y"
                         [matMenuTriggerFor]="contextMenu">
                    </div>
                    <mat-menu #contextMenu="matMenu">
                      <ng-template matMenuContent let-item="item">
                        <button mat-menu-item (click)="addNew()">
                          <mat-icon>add_box</mat-icon>
                          <span>Add Record</span>
                        </button>
                        <button mat-menu-item (click)="editCall(item)">
                          <mat-icon>create</mat-icon>
                          <span>Edit Record</span>
                        </button>

                        <button mat-menu-item (click)="refresh()">
                          <mat-icon>refresh</mat-icon>
                          <span>Refresh Record</span>
                        </button>
                        <button mat-menu-item disabled>
                          <mat-icon>no_encryption</mat-icon>
                          <span>Disable</span>
                        </button>
                        <button mat-menu-item [matMenuTriggerFor]="nestedmenu">
                          <mat-icon>list_alt</mat-icon>
                          <span> Nested Menu</span>
                        </button>
                      </ng-template>
                    </mat-menu>
                    <mat-menu #nestedmenu="matMenu">
                      <button mat-menu-item>
                        <mat-icon>mail_outline</mat-icon>
                        <span>Item 1</span>
                      </button>
                      <button mat-menu-item>
                        <mat-icon>call</mat-icon>
                        <span>Item 2</span>
                      </button>
                      <button mat-menu-item>
                        <mat-icon>chat</mat-icon>
                        <span>Item 3</span>
                      </button>
                    </mat-menu>
                    <!-- context menu end -->
                    <div *ngIf="!exampleDatabase?.isTblLoading" class="no-results text-center my-4"
                    [style.display]="dataSource.renderedData.length === 0 ? '' : 'none'"
                    style="color: rgba(0, 0, 0, 0.301); font-size: 1.2em;">
                <mat-icon class="no-results-icon">info</mat-icon>
                <p>No hay datos disponibles</p>
                </div>
                    <mat-paginator #paginator [length]="dataSource.filteredData.length"
                                   [pageIndex]="0" [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]">
                    </mat-paginator>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
