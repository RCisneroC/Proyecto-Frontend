<div class="addContainer">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">

          <div class="modal-about">
            {{dialogTitle}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
      <form class="register-form m-4" [formGroup]="experienceForm" (ngSubmit)="submit">
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Funciones Realizadas</mat-label>
              <textarea matInput    cdkTextareaAutosize #autosize="cdkTextareaAutosize"
              cdkAutosizeMinRows="3" cdkAutosizeMaxRows="5"
           
              formControlName="description">
          </textarea>
            </mat-form-field>
          </div>
          
        
        </div>
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Cargo</mat-label>
              <input matInput formControlName="position" >
              <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
            
            </mat-form-field>
          </div>
         
        </div>
        <div class="row">
            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Fecha de Inicio </mat-label>
                  <input matInput [matDatepicker]="pickerStart1" formControlName="startDate">
                  <mat-datepicker-toggle matSuffix [for]="pickerStart1"></mat-datepicker-toggle>
                  <mat-datepicker #pickerStart1></mat-datepicker>
                  <mat-error *ngIf="experienceForm.get('startDate')?.hasError('required')">
                    Selecciones una fecha
                  </mat-error>
                </mat-form-field>
              </div>
              <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Fecha fin </mat-label>
                  <input matInput [matDatepicker]="pickerStart2" formControlName="endDate">
                  <mat-datepicker-toggle matSuffix [for]="pickerStart2"></mat-datepicker-toggle>
                  <mat-datepicker #pickerStart2></mat-datepicker>
                  <mat-error *ngIf="experienceForm.get('endDate')?.hasError('required')">
                    Selecciones una fecha
                  </mat-error>
                </mat-form-field>
              </div>
          </div>
     
       
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
              <div class="example-button-row">
                <button mat-raised-button color="primary" [disabled]="!experienceForm.valid" 
                  (click)="confirmAdd()">Guardar</button>
                <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
              </div>
            </div>
          </div>
      </form>
    </div>
  </div>
