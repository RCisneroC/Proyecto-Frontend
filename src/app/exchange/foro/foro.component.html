<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Foro'" [items]="['Home','Intercambio']" [active_item]="'Foro'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix">
      <!-- Basic Examples -->
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>
              <strong>Foro</strong>
              <small>Find your solutions from here.</small>
            </h2>
          </div>
          <div class="body">
            <div class="row clearfix">
              <div class="col-xs-12 ol-sm-12 col-md-12 col-lg-12">
                <mat-tab-group>
                  <mat-tab label="General">
                    <mat-accordion>
                      <mat-expansion-panel *ngFor="let item of Foros">
                        <mat-expansion-panel-header>
                          <mat-panel-title>
                            {{ item.title }}
                          </mat-panel-title>
                        </mat-expansion-panel-header>
                        <div class="row">
                          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                            <div class="panel-body">
                              {{item.description}}

                            </div>

                            <div class="mt-2">
                              <button mat-icon-button aria-label="Example icon-button with a heart icon"
                                      class="btn btn-circle bg-green msr-2">
                                <mat-icon>thumb_up</mat-icon>
                              </button>
                              <button mat-icon-button aria-label="Example icon-button with a heart icon"
                                      class="btn btn-circle bg-red">
                                <mat-icon>thumb_down</mat-icon>
                              </button>
                            </div>
                            <div class="mt-2">
                              <ckeditor [editor]="Editor" data=""></ckeditor>
                            </div>
                            <div class="mt-2">
                              <button mat-raised-button color="primary"
                                      >Comentar</button>
                            </div>
                          </div>
                        </div>
                      </mat-expansion-panel>
                    </mat-accordion>
                  </mat-tab>
                </mat-tab-group>

              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- #END# Basic Examples -->
    </div>
  </div>
</section>
