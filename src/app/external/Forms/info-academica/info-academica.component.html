<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          Nueva información Academica
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogACRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="modalityACForm" (ngSubmit)="submit">
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Institución</mat-label>
            <input [ngModel]="DetalleAC.institution" matInput formControlName="institution">
            <mat-error *ngIf="modalityACForm.get('institution')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Programa</mat-label>
            <input [ngModel]="DetalleAC.program" matInput formControlName="program">
            <mat-error *ngIf="modalityACForm.get('program')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Titulo Obtenido</mat-label>
            <input [ngModel]="DetalleAC.obtainedTitle" matInput formControlName="obtainedTitle">
            <mat-error *ngIf="modalityACForm.get('obtainedTitle')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>AÑO</mat-label>
            <input [ngModel]="DetalleAC.year" matInput formControlName="year">
            <mat-error *ngIf="modalityACForm.get('year')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary" (click)="submit()" [disabled]="!modalityACForm.valid"
            >Guardar</button>
            <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
