<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          Nueva Experiencia Laboral
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogILRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="modalityILForm" (ngSubmit)="submit">
      <div class="row">

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Entidad</mat-label>
            <input [ngModel]="DetalleIL.entidad" matInput formControlName="entidad">
            <mat-error *ngIf="modalityILForm.get('entidad')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Cargo</mat-label>
            <input [ngModel]="DetalleIL.position" matInput formControlName="position">
            <mat-error *ngIf="modalityILForm.get('position')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>

      </div>
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Periodo</mat-label>
            <input [ngModel]="DetalleIL.periodo" matInput formControlName="periodo">
            <mat-error *ngIf="modalityILForm.get('periodo')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Meses</mat-label>
            <input [ngModel]="DetalleIL.meses" matInput formControlName="meses">
            <mat-error *ngIf="modalityILForm.get('meses')?.hasError('required')">
              Campo requerido
            </mat-error>
          </mat-form-field>
        </div>

      </div>

      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary" (click)="submit()" [disabled]="!modalityILForm.valid"
            >Guardar</button>
            <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
