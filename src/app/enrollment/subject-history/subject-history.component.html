<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Historial Asignaturas'" [items]="['Inicio','Listado de Matricula']"
        [active_item]="'Historial Asignaturas'">
      </app-breadcrumb>
    </div>

    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header">
            <h2 class="text-uppercase"><strong>Listado de Asignaturas</strong>
              <br>
            </h2>
          </div>
          <div class="body">
            <div class="body table-responsive">
              <table mat-table [dataSource]="dataInfo" class="w-100">
                <ng-container matColumnDef="descriptionSuject">
                  <th mat-header-cell *matHeaderCellDef> Asignatura </th>
                  <td mat-cell *matCellDef="let element">{{ element.descriptionSuject }} </td>
                </ng-container>
                <ng-container matColumnDef="subjectStatusId">
                  <th mat-header-cell *matHeaderCellDef> Estado </th>
                  <td mat-cell *matCellDef="let element"><span class="badge badge-solid-blue">{{ element.subjectStatusId | statusMatricula }}</span> </td>
                </ng-container>
                <ng-container matColumnDef="mallaName">
                  <th mat-header-cell *matHeaderCellDef> Malla </th>
                  <td mat-cell *matCellDef="let element">{{ element.mallaName }} </td>
                </ng-container>
                <ng-container matColumnDef="nAmeDegree">
                  <th mat-header-cell *matHeaderCellDef> Grado </th>
                  <td mat-cell *matCellDef="let element">{{ element.nAmeDegree}}</td>
                </ng-container>
                <ng-container matColumnDef="periodDescription">
                  <th mat-header-cell *matHeaderCellDef> Período</th>
                  <td mat-cell *matCellDef="let element">{{ element.periodDescription }} </td>
                </ng-container>
                <ng-container matColumnDef="years">
                  <th mat-header-cell *matHeaderCellDef> Año</th>
                  <td mat-cell *matCellDef="let element">{{ element.years }} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="DisplayNameInfo"></tr>
                <tr mat-row *matRowDef="let row; columns: DisplayNameInfo;"></tr>
              </table>
              <mat-paginator #paginador [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
            </div>
          </div>
          <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
        </div>
      </div>
    </div>
  </div>
</section>
