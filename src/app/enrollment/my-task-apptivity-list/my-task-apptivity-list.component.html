<section class="content">
  <div class="content-block">

    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Tareas'" [items]="['Matricula','Mis tareas']"
                      [active_item]="'Listado de Tareas'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix" style="margin-bottom: 20px;text-align: right;">
      <div class="card">

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-6" style="margin: auto;margin-top: 15px;">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Seleccione una aptividad</mat-label>
            <!-- <input matInput formControlName="degreeObtained" > -->

            <mat-select [(ngModel)]="selectedOption"  (selectionChange)="viewCalendar($event)">
              <mat-option *ngFor="let subject of subjectList" [value]="subject.asignaturaId">{{subject.asignatura}}</mat-option>
            </mat-select>


          </mat-form-field>
        </div>
      </div>

    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">


          <div class="header">
            <h2 class="text-uppercase"><strong>Listado de Tareas<span class="badge badge-solid-blue"></span></strong></h2>
          </div>
          <div class="body">
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                  <div class="calendar-container">
                    <full-calendar [options]="calendarOptions"></full-calendar>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
