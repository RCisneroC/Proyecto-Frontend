<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="roleForm" (ngSubmit)="submit">
            <div class="row">
                <div class="col-xl12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Seleccione Funcionalidad</mat-label>
                        <mat-select (ngModelChange)="menuSelect($event)" formControlName="MenuId">
                            <mat-option *ngFor="let row of _SubjectResponse" [value]="row.id">{{row.title}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>

            <form class="register-form m-4" [formGroup]="roleForm" (ngSubmit)="submit">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="card">
                            <div class="body table-responsive">
                                <mat-form-field class="example-full-width" appearance="outline">
                                    <mat-label>Filtro</mat-label>
                                    <input matInput (keyup)="applyFilter($event)" placeholder=".....">
                                </mat-form-field>
                                <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
                                <table *ngIf="!IsLoading" mat-table [dataSource]="ListadoSubMenu" class="w-100">
                                    <!-- id Column -->
                                    <ng-container matColumnDef="id">
                                        <th mat-header-cell *matHeaderCellDef>Id </th>
                                        <td mat-cell *matCellDef="let element">
                                            <mat-checkbox (change)="checkboxChange($event, element.id)"></mat-checkbox>
                                        </td>
                                    </ng-container>
                                    <!-- name Column -->
                                    <ng-container matColumnDef="name">
                                        <th mat-header-cell *matHeaderCellDef>Nombre </th>
                                        <td mat-cell *matCellDef="let element"> {{element.title}} </td>
                                    </ng-container>
                                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                                </table>
                                <mat-paginator #paginatorPoster [pageSizeOptions]="[5, 10, 20]"
                                    showFirstLastButtons></mat-paginator>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" mat-raised-button color="primary"
                            [disabled]="!roleForm.valid" (click)="submit()">Guardar</button>
                        <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
