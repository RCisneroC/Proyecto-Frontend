<div class="addContainer">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">
          <!-- <img [src]='advanceTable.img' alt="avatar"> -->
          <div class="modal-about">
            {{dialogTitle}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
      <form class="register-form m-4" [formGroup]="userForm" (ngSubmit)="submit">
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Usuario</mat-label>
              <input matInput formControlName="userName" >
              <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
            
            </mat-form-field>
          </div>
          
         
        </div>
        <div class="row">
            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
              <mat-form-field class="example-full-width" appearance="outline">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="firstName">
                <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
                <mat-error *ngIf="userForm.get('firstName')?.hasError('required')">
                  El nombre es requerido
                </mat-error>
              </mat-form-field>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Apellido</mat-label>
                  <input matInput formControlName="lastName">
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
                  <mat-error *ngIf="userForm.get('lastName')?.hasError('required')">
                    El apellido es requerido
                  </mat-error>
                </mat-form-field>
              </div>
              <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Email</mat-label>
                  <input matInput formControlName="email">
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
                  <mat-error *ngIf="userForm.get('email')?.hasError('required')">
                    El email es requerido
                  </mat-error>
                </mat-form-field>
              </div>
              <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Telefono</mat-label>
                  <input matInput formControlName="phoneNumber">
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
                  <mat-error *ngIf="userForm.get('phoneNumber')?.hasError('required')">
                    El telefono es requerido
                  </mat-error>
                </mat-form-field>
              </div>

           
           
          </div>
          <div  class="row">
            <div class=" col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
              <mat-form-field class="example-full-width " appearance="outline">
                <mat-label>rol</mat-label>
                <mat-select formControlName="roles" >
                  <mat-option *ngFor="let line of roleList"  [value]="line.name">{{line.name}}</mat-option>
                </mat-select>
                <mat-error *ngIf="userForm.get('roles')?.hasError('required')">
                  el rol es requerido
                </mat-error>
              </mat-form-field>
            </div>
            <div class=" col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
              <mat-form-field class="example-full-width " appearance="outline">
                <mat-label>Estatus</mat-label>
                <mat-select formControlName="userStatusId" >
                  <mat-option [value]="1">
                      Activo
                  </mat-option>
                  <mat-option [value]="2">
                      Inactivo
                  </mat-option>
               
                  
                </mat-select>
                <mat-error *ngIf="userForm.get('state')?.hasError('required')">
                  el estatus es requerido
                </mat-error>
              </mat-form-field>
            </div>
          </div>
       
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
              <div class="example-button-row">
                <button mat-raised-button color="primary" [disabled]="!userForm.valid" 
                  (click)="confirmAdd()">Guardar</button>
                <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
              </div>
            </div>
          </div>
      </form>
    </div>
  </div>
