<section class="content">
    <div class="content-block">
        <div class="block-header">
            <!-- breadcrumb -->
            <app-breadcrumb [title]="'Diseño Curricular'" [items]="['Inicio','Intranet','Actividades']"
                [active_item]="'Tareas/Contenido'">
            </app-breadcrumb>
        </div>
        <div class="row clearfix" style="margin-bottom: 20px;text-align: right;">
            <div class="">
                <button matTooltip="Regresar" mat-raised-button color="accent" (click)="volverAtras()">
                    <mat-icon>keyboard_backspace</mat-icon> Regresar
                </button>
            </div>
        </div>
        <div class="row clearfix">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                <div class="card">
                    <div class="header">
                        <h2 class="text-uppercase">Tareas para la Actividad : ({{ _OneActivity.name }})

                            <button (click)="NewTask()" matTooltip="Agregar Plan de Estudio"
                                style="position: absolute;right: 5px;top: 5px;" mat-mini-fab color="primary">
                                <mat-icon>add</mat-icon>
                            </button>

                        </h2>
                    </div>
                    <div class="body">
                        <div class="body table-responsive">
                            <mat-form-field class="example-full-width" appearance="outline">
                                <mat-label>Filtro</mat-label>
                                <input matInput (keyup)="applyFilter($event)" placeholder=".....">
                            </mat-form-field>
                            <table mat-table [dataSource]="dataTask" class="w-100">
                                <ng-container matColumnDef="name">
                                    <th mat-header-cell *matHeaderCellDef> Titulo </th>
                                    <td mat-cell *matCellDef="let element">{{ element.title }} </td>
                                </ng-container>
                                <ng-container matColumnDef="tipo">
                                    <th mat-header-cell *matHeaderCellDef> Tipo </th>
                                    <td mat-cell *matCellDef="let element"> {{ element.taskType.name }}</td>
                                </ng-container>
                                <ng-container matColumnDef="Actividad">
                                    <th mat-header-cell *matHeaderCellDef> Asignatura</th>
                                    <td mat-cell *matCellDef="let element">{{ element.activity.name }} </td>
                                </ng-container>
                                <ng-container matColumnDef="observacion">
                                    <th mat-header-cell *matHeaderCellDef> Observación</th>
                                    <td mat-cell *matCellDef="let element">{{ element.observation }} </td>
                                </ng-container>
                                <ng-container matColumnDef="finalDate">
                                    <th mat-header-cell *matHeaderCellDef> Fecha Final </th>
                                    <td mat-cell *matCellDef="let element">{{ element.finalDate |date:'dd/M/yyyy' }}
                                    </td>
                                </ng-container>
                                <ng-container matColumnDef="accion">
                                    <th mat-header-cell *matHeaderCellDef> Acción </th>
                                    <td mat-cell *matCellDef="let element">
                                        <button (click)="editarTarea(element)" mat-mini-fab color="primary"
                                            matTooltip="Editar">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                        <button (click)="deleteTask(element)" mat-mini-fab color="accent"
                                            matTooltip="Editar">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </td>
                                </ng-container>
                                <tr mat-header-row *matHeaderRowDef="DisplayNameDocument"></tr>
                                <tr mat-row *matRowDef="let row; columns: DisplayNameDocument;"></tr>
                            </table>
                            <mat-paginator #paginator [pageSizeOptions]="[2, 10, 20]"
                                showFirstLastButtons></mat-paginator>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
