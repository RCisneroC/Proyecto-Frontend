<div class="addContainer">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">
          <div class="modal-about">
            {{dialogTitle}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="taskForm" >
            <div class="row">
             
                  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-4">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Título</mat-label>
                      <input matInput formControlName="title">
                      <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>title</mat-icon>
                      <mat-error *ngIf="taskForm.get('title')?.hasError('required')">
                        El título es requerido
                      </mat-error>
                    </mat-form-field>
                  </div>
                  
                  <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-4">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Descripción</mat-label>
                      <input matInput formControlName="description">
                      <mat-error *ngIf="taskForm.get('description')?.hasError('required')">
                        La descripción es requerida
                      </mat-error>
                    </mat-form-field>
                  </div>
                  
                  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-4">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Completada</mat-label>
                      <mat-select formControlName="completed">
                        <mat-option [value]="true">Sí</mat-option>
                        <mat-option [value]="false">No</mat-option>
                      </mat-select>
                      <mat-error *ngIf="taskForm.get('completed')?.hasError('required')">
                        El estado es requerido
                      </mat-error>
                    </mat-form-field>
                  </div>

       
        </div>
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
              <div class="example-button-row">
                <button mat-raised-button color="primary" [disabled]="!taskForm.valid"
                  (click)="confirmAdd()">Guardar</button>
                <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
              </div>
            </div>
          </div>
      </form>
    </div>
  </div>
