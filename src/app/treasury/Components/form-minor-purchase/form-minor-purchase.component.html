<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{dialogTitle}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="form">
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
        </div>


        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Unidad Solicitante</mat-label>
            <input  matInput formControlName="unidadSolicitante">
            <mat-error *ngIf="form.get('unidadSolicitante')?.hasError('required')">
              La Unidad Solicitante es requerido
            </mat-error>
          </mat-form-field>
        </div>


        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Entreguese a</mat-label>
            <input matInput formControlName="entregueseA">
            <mat-error *ngIf="form.get('entregueseA')?.hasError('required')">
              Entreguese a es requerido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>En concepto de</mat-label>
            <input matInput formControlName="conceptoDe">
            <mat-error *ngIf="form.get('conceptoDe')?.hasError('required')">
              En concepto de es requerido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Suma de</mat-label>
            <input type="number"  matInput formControlName="sumaDe">
            <mat-error *ngIf="form.get('sumaDe')?.hasError('required')">
              La Suma  es requerido
            </mat-error>
            <mat-error *ngIf="form.get('sumaDe')?.hasError('pattern')">
             La Suma de no tiene un formato válido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2" *ngIf="this.action==='new'">
          <mat-form-field class="example-full-width " appearance="outline">
            <mat-label>Periodo Contable</mat-label>
            <mat-select formControlName="periodoContableId">
              <mat-option [value]="row.periodoId" *ngFor="let row of this.periodos">
                {{row.descripcion}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('periodoContableId')?.hasError('required')">
              El periodo contable es requerido
            </mat-error>
          </mat-form-field>
        </div>

      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary" [disabled]="!form.valid" (click)="confirmAdd()">Guardar</button>
            <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
