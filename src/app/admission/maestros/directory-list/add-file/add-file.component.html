<div class="addContainer">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">
          <div class="modal-about">
            {{dialogTitle}}
          </div>
        </div>
      </div>
      <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
        <form [formGroup]="FormsEFDocument!">
            <ng-template matStepLabel>Documentos</ng-template>
            <div class="row">
                    <mat-label style="font-weight: bold;">Archivo</mat-label>
                    <app-file-upload (change)="onFileSelected($event)"
                        formControlName="file"></app-file-upload>
                        <mat-error *ngIf="FormsEFDocument.get('file')?.hasError('required')">
                            es  requerido
                          </mat-error>
            </div>
        
     
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
              <div class="example-button-row">
                <button mat-raised-button color="primary" [disabled]="!FormsEFDocument.valid" 
                  (click)="confirmAdd()">Guardar</button>
                <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
              </div>
            </div>
          </div>
      </form>
    </div>
  </div>
