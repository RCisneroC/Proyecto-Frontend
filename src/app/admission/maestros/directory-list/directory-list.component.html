
  <section class="content">
    <div class="content-block">
      <div class="block-header">
        <!-- breadcrumb -->
        <app-breadcrumb [title]="'Gestión documentaria'" [items]="['Inicio','Ajustes']" [active_item]="'Gestión documentaria'">
        </app-breadcrumb>
      </div>
      <div class="row clearfix">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <div class="card">
            <div class="header">
              <h2 class="text-uppercase"><strong>Gestión documentaria</strong></h2>
            </div>
            <div class="body">
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="card">
                   
                    <div class="body overflow-auto">
                      <div class="responsive_table">
                   
                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                          <ng-container matColumnDef="folderName">
                            <th mat-header-cell *matHeaderCellDef>
                              <span [style.paddingLeft.px]="40"> Carpetas </span>
                            </th>
                            <td mat-cell *matCellDef="let data">
                              <button
                                mat-icon-button
                                [style.visibility]="!data.expandable ? 'hidden' : ''"
                                [style.marginLeft.px]="data.level * 32"
                                (click)="treeControl.toggle(data)"
                              >
                              
                                <!-- <mat-icon class="mat-icon-rtl-mirror">
                                  {{treeControl.isExpanded(data) ? 'expand_more' : 'chevron_right'}}
                                </mat-icon> -->
                                <mat-icon
                                  *ngIf="treeControl.isExpanded(data)"
                                  class="mat-icon-rtl-mirror" color="primary"
                                  >folder_open </mat-icon>
                        
                                <mat-icon
                                  *ngIf="!treeControl.isExpanded(data)"
                                  class="mat-icon-rtl-mirror" color="primary"
                                  >folder </mat-icon
                                >
                              </button>
                             <ng-container *ngFor="let file of  data.files">
                              {{file.folderName}}
                             </ng-container>
                              {{data.folderName}}
                        
                            </td>
                          </ng-container>
                     
                          <ng-container matColumnDef="extension">
                            <th mat-header-cell *matHeaderCellDef>Extension</th>
                            <td mat-cell *matCellDef="let data">
                              {{data?.extension}}
                            </td>
                          </ng-container>
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef>Acciones  
                              <mat-icon style="position: absolute;right: 47px;"  [cdkMenuTriggerFor]="menu" class="example-standalone-trigger">more_vert</mat-icon>
                              </th>
                           
                             
                            <td mat-cell *matCellDef="let data">
                            
                              <mat-button-toggle-group  >
                                <mat-button-toggle style="border: none;" *ngIf="data.extension!==null && data.hasReadPermission " (click)="viewDocumento(data)" value="bold"><mat-icon   >remove_red_eye</mat-icon></mat-button-toggle>
                                <mat-button-toggle style="border: none;" *ngIf="data.extension!==null && data.hasExecutePermission" (click)="download(data)"  value="italic"><mat-icon  >file_download</mat-icon></mat-button-toggle>
                                <mat-button-toggle style="border: none;" *ngIf="data.extension!==null" value="underline"> <mat-icon [cdkMenuTriggerFor]="menu"  class="example-standalone-trigger">more_vert</mat-icon></mat-button-toggle>
                              </mat-button-toggle-group>
                              <!-- <mat-icon (click)="viewDocumento(data)"  *ngIf="data.extension!==undefined">remove_red_eye</mat-icon>
                              <mat-icon (click)="download(data)"  *ngIf="data.extension!==undefined">file_download</mat-icon>
                              <mat-icon [cdkMenuTriggerFor]="menu" *ngIf="data.extension!==undefined" class="example-standalone-trigger">more_vert</mat-icon>
                              -->
                              <div *ngIf="data.extension===null">
                              <mat-icon [cdkMenuTriggerFor]="menu" class="example-standalone-trigger">more_vert</mat-icon>
                              </div>
                              <ng-template #menu>
                                <div class="example-menu" cdkMenu>
                                  <!-- <button class="example-menu-item" (click)="newFolder(data)" cdkMenuItem>Carpeta</button> -->
                                  <!-- <button class="example-menu-item" (click)="downloadZip(data)" cdkMenuItem>Descargar zip</button> -->
                                  <button class="example-menu-item" *ngIf="data.extension===null && data.hasOnloadfile"  (click)="newfile(data,'folder')" cdkMenuItem>Cargar archivo</button>
                                  <button class="example-menu-item" *ngIf="data.extension===null && data.update" (click)="newFolder(data,'folder')" cdkMenuItem>Cambiar nombre</button>
                                   <button class="example-menu-item" *ngIf="data.extension===null && data.hasWritePermission" (click)="newFolder(data,'newfolder')" cdkMenuItem>Nueva carpeta</button>
                                  <button class="example-menu-item" *ngIf="data.extension!==null && data.delete" (click)="newfile(data,'file')" cdkMenu2Item>Remplazar archivo</button>
                                  <button class="example-menu-item" *ngIf="data.extension!==null && data.update"  (click)="newFolder(data,'file')" cdkMenu2Item>Cambiar nombre</button> 
                                  
                                  <button class="example-menu-item" *ngIf="data.extension===null && typeUser==='Administrador'"  (click)="permissions(data,'folder')" cdkMenu2Item>Dar Permisos</button> 
                                  <button class="example-menu-item" *ngIf="data.extension!==null && typeUser==='Administrador'"  (click)="permissions(data,'file')" cdkMenu2Item>Dar Permisos</button> 
                                </div>
                              </ng-template>
                              

                            </td>
                          </ng-container>
                      
                          <ng-template #menu>
                            <div class="example-menu" cdkMenu>
                              <button class="example-menu-item" (click)="newFolder(null,'raiz')" cdkMenuItem> Nueva carpeta</button>
                          
                            </div>
                          </ng-template>
                      

                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                     
                        
                      </div>
             
              
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
