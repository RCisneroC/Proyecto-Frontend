
  
  <div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    
                </div>
            </div>
        </div>
        <button mat-icon-button  (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form [formGroup]="folderForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
        
      
            <mat-form-field class="example-full-width" appearance="outline">
              <mat-label>Nombre</mat-label>
              <input  matInput  formControlName="folderName">

              <mat-error *ngIf="folderForm.get('folderName')?.hasError('required')">
                es  requerido
              </mat-error>
            </mat-form-field>
          </div>
        </div>
          <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-12">
              <div class="example-button-row">
            <button mat-raised-button  color="primary" type="submit">Guardar</button>
            <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
          </div>
        </div>
      </div>
          </form>
    </div>
</div>
