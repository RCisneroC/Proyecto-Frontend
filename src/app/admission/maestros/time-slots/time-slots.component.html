<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{dialogTitle}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="timeSlotsForm">
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field appearance="outline">
            <mat-label>Fecha Inicial</mat-label>
            <input matInput appearance="outline" [ngxMatTimepicker]="pickerA" formControlName="fechaHoraInicial"
              placeholder="HH:MM" readonly />
            <mat-icon matSuffix (click)="pickerA.open()">
              watch_later
            </mat-icon>
            <mat-error *ngIf="timeSlotsForm.get('fechaHoraInicial')?.hasError('required') && pressSave">
              Selecciones una fecha inicial
            </mat-error>
          </mat-form-field>
          <ngx-mat-timepicker #pickerA></ngx-mat-timepicker>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field appearance="outline">
            <mat-label>Fecha final </mat-label>
            <input matInput appearance="outline" [ngxMatTimepicker]="pickerB" formControlName="fechaHoraFinal"
              placeholder="HH:MM" readonly />
            <mat-icon matSuffix (click)="pickerB.open()">
              watch_later
            </mat-icon>
            <mat-error *ngIf="timeSlotsForm.get('fechaHoraFinal')?.hasError('required') && pressSave">
              Selecciones una fecha final
            </mat-error>
          </mat-form-field>
          <ngx-mat-timepicker #pickerB></ngx-mat-timepicker>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
          <table *ngIf="!IsLoading" mat-table [dataSource]="dataSource" class="w-100">
            <ng-container matColumnDef="startTime">
              <th mat-header-cell *matHeaderCellDef> Hora Inicio</th>
              <td mat-cell *matCellDef="let element"> {{element.startTime | date:'shortTime'}} </td>
            </ng-container>
            <ng-container matColumnDef="endTime">
              <th mat-header-cell *matHeaderCellDef> Hora Fin</th>
              <td mat-cell *matCellDef="let element"> {{element.endTime | date:'shortTime'}} </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Acción</th>
              <td mat-cell *matCellDef="let element">
                <button mat-mini-fab color="primary" title="Editar" (click)="$event.stopPropagation()"
                  (click)="editar(element)" class="tbl-action-btn">
                  <app-feather-icons [icon]="'edit'"></app-feather-icons>
                </button>
                <button mat-mini-fab color="accent" title="Eliminar" (click)="$event.stopPropagation()"
                  (click)="eliminar(element)" class="tbl-action-btn">
                  <app-feather-icons [icon]="'trash'"></app-feather-icons>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator #paginatorTimeSlot [pageSizeOptions]="[5]" showFirstLastButtons></mat-paginator>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary" [disabled]="!timeSlotsForm.valid"
              (click)="confirmAdd()">Guardar</button>
            <button mat-raised-button *ngIf="!IsLoading" color="warn" (click)="Limpiar()" tabindex="-1">Limpiar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
