
<section class="content">
    <div class="content-block">
      <div class="block-header">
        <!-- breadcrumb -->
        <app-breadcrumb [title]="'Gestión documentaria'" [items]="['Inicio','Ajustes']" [active_item]="'Gestión documentaria'">
        </app-breadcrumb>
      </div>
      <div class="row clearfix">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <div class="card">
            <div class="header">
              <h2 class="text-uppercase"><strong>Gestión documentaria</strong></h2>
            </div>
            <div class="body">
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="card">
                   
                    <div class="body overflow-auto">
                      <div class="responsive_table">
                   
                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                          <ng-container matColumnDef="folderName">
                            <th mat-header-cell *matHeaderCellDef>
                              <span [style.paddingLeft.px]="40"> Carpetas </span>
                            </th>
                            <td mat-cell *matCellDef="let data">
                              <button
                                mat-icon-button
                                [style.visibility]="!data.expandable ? 'hidden' : ''"
                                [style.marginLeft.px]="data.level * 32"
                                (click)="treeControl.toggle(data)"
                              >
                              
                                <!-- <mat-icon class="mat-icon-rtl-mirror">
                                  {{treeControl.isExpanded(data) ? 'expand_more' : 'chevron_right'}}
                                </mat-icon> -->
                                <mat-icon
                                  *ngIf="treeControl.isExpanded(data)"
                                  class="mat-icon-rtl-mirror" color="primary"
                                  >folder_open </mat-icon>
                        
                                <mat-icon
                                  *ngIf="!treeControl.isExpanded(data)"
                                  class="mat-icon-rtl-mirror" color="primary"
                                  >folder </mat-icon
                                >
                              </button>
                             
                              {{data.folderName}}
                        
                            </td>
                          </ng-container>
                          <ng-container matColumnDef="createdDate">
                            <th mat-header-cell *matHeaderCellDef>Fecha de creación</th>
                            <td mat-cell *matCellDef="let data">
                              <!-- {{data?.createdDate}} -->
                              13/01/2024
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="createdBy">
                            <th mat-header-cell *matHeaderCellDef>Creado por</th>
                            <td mat-cell *matCellDef="let data">
                              <!-- {{data?.createdDate}} -->
                              Ricardo Cisnero
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="lastModifiedDate">
                            <th mat-header-cell *matHeaderCellDef>Fecha de modificación</th>
                            <td mat-cell *matCellDef="let data">
                              <!-- {{data?.createdDate}} -->
                              23/02/2024
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="lastModifiedBy">
                            <th mat-header-cell *matHeaderCellDef>Modificado por</th>
                            <td mat-cell *matCellDef="let data">
                              <!-- {{data?.createdDate}} -->
                             Ricardo Cisnero
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="changeType">
                            <th mat-header-cell *matHeaderCellDef>Tipo de cambio</th>
                            <td mat-cell *matCellDef="let data">
                              <!-- {{data?.createdDate}} -->
                              Cambiar nombre
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="extension">
                            <th mat-header-cell *matHeaderCellDef>Extension</th>
                            <td mat-cell *matCellDef="let data">
                              {{data?.extension}}
                            </td>
                          </ng-container>
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef>Acciones</th>
                           
                             
                            <td mat-cell *matCellDef="let data">
                            
                              <mat-button-toggle-group  >
                                <mat-button-toggle style="border: none;" *ngIf="data.extension===undefined"  value="bold"><mat-icon (click)="viewHistory(data,'folder')" >remove_red_eye</mat-icon></mat-button-toggle>
                                <mat-button-toggle style="border: none;" *ngIf="data.extension!==undefined"  value="bold"><mat-icon (click)="viewHistory(data,'file')" >remove_red_eye</mat-icon></mat-button-toggle>
 
                                
                              </mat-button-toggle-group>
                              <!-- <mat-icon (click)="viewDocumento(data)"  *ngIf="data.extension!==undefined">remove_red_eye</mat-icon>
                              <mat-icon (click)="download(data)"  *ngIf="data.extension!==undefined">file_download</mat-icon>
                              <mat-icon [cdkMenuTriggerFor]="menu" *ngIf="data.extension!==undefined" class="example-standalone-trigger">more_vert</mat-icon>
                              -->
                              <!-- <div *ngIf="data.extension===undefined">
                              
                              <mat-button-toggle style="border: none;" *ngIf="data.extension!==undefined" value="bold"><mat-icon (click)="viewHistory(data)"  *ngIf="data.extension!==undefined">remove_red_eye</mat-icon></mat-button-toggle>
                              </div> -->
                         

                            </td>
                          </ng-container>
                      
                        

                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                     
                        
                      </div>
             
              
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
