<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="requiremetForm" (ngSubmit)="submit">
            <div class="row clearfix">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="card">
                        <div class="body table-responsive">
                            <mat-form-field class="example-full-width" appearance="outline">
                                <mat-label>Filtro</mat-label>
                                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium">
                            </mat-form-field>
                            <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
                            <table *ngIf="!IsLoading" mat-table [dataSource]="ListadoDocumentos" class="w-100">
                                <!-- id Column -->
                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef>Id </th>
                                    <td mat-cell *matCellDef="let element">
                                        <mat-checkbox (change)="checkboxChange($event, element.id)"></mat-checkbox>
                                    </td>
                                </ng-container>
                                <!-- name Column -->
                                <ng-container matColumnDef="name">
                                    <th mat-header-cell *matHeaderCellDef>Nombre </th>
                                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                                </ng-container>
                                <!-- description Column -->
                                <ng-container matColumnDef="description">
                                    <th mat-header-cell *matHeaderCellDef> Descripción </th>
                                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                                </ng-container>
                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                            </table>
                            <mat-paginator #paginatorPoster [pageSizeOptions]="[5, 10, 20]"
                                showFirstLastButtons></mat-paginator>
                        </div>
                    </div>
                </div>
            </div>
            <button mat-raised-button color="primary" [disabled]="!requiremetForm.valid"
                (click)="submit()">Guardar</button>
        </form>
    </div>
</div>
