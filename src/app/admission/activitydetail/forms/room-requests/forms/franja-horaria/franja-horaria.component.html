<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{dialogTitle}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="timeSlotsForm">
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Salón</mat-label>
            <mat-select (selectionChange)="LoadDates()" formControlName="salon">
              <mat-option [value]="" selected></mat-option>
              <mat-option *ngFor="let item of data.rooms" [value]="item.room.id">{{item.room.name}}</mat-option>
            </mat-select>
            <mat-error *ngIf="timeSlotsForm.get('salon')?.hasError('required')">
              Seleccione un salon
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
          <mat-form-field class="example-full-width" appearance="outline">
            <mat-label>Fecha</mat-label>
            <input (dateChange)="LoadTimeSlot()" [matDatepickerFilter]="FiltrarFechas" matInput [matDatepicker]="picker"
              formControlName="fecha" [disabled]="deshabilitarFecha" [readonly]="true"
              [min]="data.requestRooms.startDate" [max]="data.requestRooms.endDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker [disabled]="deshabilitarFecha"></mat-datepicker>
            <mat-error *ngIf="timeSlotsForm.get('fecha')?.hasError('required')">
              Selecciones una fecha
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
          <table *ngIf="!IsLoading" mat-table [dataSource]="dataSource" class="w-100">
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>Id </th>
              <td mat-cell *matCellDef="let element">
                <mat-checkbox [checked]="checkBoxIsSelecterd(element.id)"
                  (change)="checkboxChange($event, element.id)"></mat-checkbox>
              </td>
            </ng-container>
            <ng-container matColumnDef="startTime">
              <th mat-header-cell *matHeaderCellDef> Hora Inicio</th>
              <td mat-cell *matCellDef="let element"> {{element.startTime | date:'shortTime'}} </td>
            </ng-container>
            <ng-container matColumnDef="endTime">
              <th mat-header-cell *matHeaderCellDef> Hora Fin</th>
              <td mat-cell *matCellDef="let element"> {{element.endTime | date:'shortTime'}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator #paginatorTimeSlot [pageSizeOptions]="[3]" showFirstLastButtons></mat-paginator>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button (click)="guardar()" mat-raised-button color="primary"
              [disabled]="!timeSlotsForm.valid">Guardar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
