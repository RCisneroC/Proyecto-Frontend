<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <div class="row clearfix">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <!-- <div class="card"> -->
                    <div class="body">
                    <div mat-dialog-content>
                        <form class="register-form m-4" [formGroup]="requestRoomsForms" (ngSubmit)="submit">
                            <div class="row">
                                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Fecha Inicio</mat-label>
                                        <input matInput [matDatepicker]="picker" formControlName="startDate">
                                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-datepicker #picker></mat-datepicker>
                                        <mat-error *ngIf="requestRoomsForms.get('startDate')?.hasError('required')">
                                            Selecciones una fecha
                                        </mat-error>
                                    </mat-form-field>
                                </div>

                                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
                                    <mat-form-field class="example-full-width" appearance="outline">
                                        <mat-label>Fecha Fin</mat-label>
                                        <input matInput [matDatepicker]="picker1" formControlName="endDate">
                                        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                                        <mat-datepicker #picker1></mat-datepicker>
                                        <mat-error *ngIf="requestRoomsForms.get('endDate')?.hasError('required')">
                                            Selecciones una fecha
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                    
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                    <div class="example-button-row">
                                        <button mat-raised-button color="primary" [disabled]="!requestRoomsForms.valid"
                                            (click)="submit()">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    </div>
                <!-- </div> -->
            </div>
        </div>
    </div>
</div>
