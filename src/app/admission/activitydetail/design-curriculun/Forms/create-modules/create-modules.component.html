<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="EditarModulosForms" (ngSubmit)="submit">
            <div class="row clearfix">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="row">
                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                            <mat-form-field class="example-full-width " appearance="outline">
                                <mat-label>Titulo</mat-label>
                                <input matInput formControlName="name">
                                <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>edit</mat-icon>
                            </mat-form-field>
                        </div>
                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-3">
                            <mat-form-field class="example-full-width" appearance="fill">
                                <mat-label>Descripcion</mat-label>
                                <textarea matInput formControlName="description"></textarea>
                                <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>edit</mat-icon>
                            </mat-form-field>
                        </div>
                        <div class="col-12" *ngIf="data.accion == 'edit-modulos'">
                            <mat-form-field class="example-full-width" appearance="outline">
                                <mat-label>Estado</mat-label>
                                <mat-select formControlName="statusId">
                                    <mat-option [value]="1">
                                        Activo
                                    </mat-option>
                                    <mat-option [value]="2">
                                        Inactivo
                                    </mat-option>

                                </mat-select>
                            </mat-form-field>
                        </div>

                    </div>
                </div>
            </div>
            <button mat-raised-button color="primary" [disabled]="!EditarModulosForms.valid"
                (click)="submit()">Guardar</button>
        </form>
    </div>
</div>
