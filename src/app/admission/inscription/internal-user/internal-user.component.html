<section class="content">
    <div class="content-block">
      <div class="block-header">
        <!-- breadcrumb -->
        <app-breadcrumb [title]="'Pre-inscripción'" [items]="['Home','Admisión']" [active_item]="'Formulario de Inscripcion'">
        </app-breadcrumb>
      </div>
      <div class="row clearfix">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <div class="card">
            <div class="header">
              <h2><strong>Formulario de Inscripcion</strong></h2>
            </div>
            <div class="body">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <div class="card">
                        <div class="materialTableHeader">
                          <div class="left">
                            <ul class="header-buttons-left ms-0">
                              <li class="tbl-title">
                                <h2>Cédula</h2>
                              </li>
                              <li class="tbl-search-box">
                                <label for="search-input"><i class="material-icons search-icon">search</i></label>
                                <input placeholder="Buscar" type="text" #filter class="browser-default search-field"
                                  aria-label="Search box">
                                  <button mat-mini-fab class="material-icons search-icon" color="primary" (click)="getPersonData()">
                                    <mat-icon >search</mat-icon>
                                  </button>
                              </li>
                            </ul>
                          </div>
                          
                        </div>
                        
                      </div>
                    </div>
                  </div>
                  
                  <mat-spinner *ngIf="loading">
                     
                  </mat-spinner>
                  
                  <div  *ngIf="personData" class="container">
                    <mat-card class="card">
                      <mat-card-subtitle> Datos de la persona </mat-card-subtitle>
                      <form [formGroup]="form" (ngSubmit)="addParticipant()">
                        <mat-grid-list
                          class="card"
                          style="color: white"
                          cols="2"
                          rowHeight="80px"
                        >
                          <mat-grid-tile [colspan]="2">
                            <mat-form-field class="mat-form-field" appearance="outline">
                              <mat-label>Nombre</mat-label>
                              <input formControlName="name" matInput autocomplete="off" [readonly]="disabled" [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.primer_nombre"/>
                            </mat-form-field>
                          </mat-grid-tile>
                          <mat-grid-tile>
                              <mat-form-field class="mat-form-field" appearance="outline">
                                  <mat-label>Primer Apellido</mat-label>
                                  <input formControlName="surname" matInput autocomplete="off"  [readonly]="disabled" [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.apellido_paterno"/>
                                </mat-form-field>
                          </mat-grid-tile>
                          <mat-grid-tile>
                              <mat-form-field class="mat-form-field" appearance="outline">
                                  <mat-label>Segundo Apellido</mat-label>
                                  <input formControlName="secondSurname" matInput autocomplete="off"  [readonly]="disabled"  [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.apellido_materno"/>
                                </mat-form-field>
                          </mat-grid-tile>
                          <mat-grid-tile>
                              <mat-form-field class="mat-form-field" appearance="outline">
                                  <mat-label>Cedula</mat-label>
                                  <input formControlName="identificationCard" matInput autocomplete="off"  [readonly]="disabled" [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.cedula"/>
                                </mat-form-field>
                          </mat-grid-tile>
                          <mat-grid-tile>
                            <mat-form-field class="mat-form-field" appearance="outline">
                                <mat-label>Provincia</mat-label>
                                <input formControlName="province" matInput autocomplete="off"  [readonly]="disabled" [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.provincia"/>
                              </mat-form-field>
                        </mat-grid-tile>
                        <mat-grid-tile>
                          <mat-form-field class="mat-form-field" appearance="outline">
                              <mat-label>Distrito</mat-label>
                              <input formControlName="judicialDistrict" matInput autocomplete="off"  [readonly]="disabled" [ngModel]="personData[0]?.DatasetPersona?.PersonaPublica?.distrito"/>
                            </mat-form-field>
                      </mat-grid-tile>
                         
                          <mat-grid-tile [colspan]="2">
                              <button [disabled]="form.invalid" type="submit" class="btnAceptar"  mat-raised-button color="primary">Aceptar</button>
                  
                              <button mat-raised-button routerLink="/admission/backoffice">Volver</button>
                          </mat-grid-tile>
                        
                        </mat-grid-list>
                      </form>
                    </mat-card>
                  </div>

            </div>
          </div>
        </div>
      </div>
    </div>
    
  </section>
