<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="PeriodForm" (ngSubmit)="submit">
            <div class="row clearfix">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <mat-form-field class="example-full-width " appearance="outline">
                        <mat-label>Salones</mat-label>
                        <mat-select formControlName="roomsIds">
                            <mat-option *ngFor="let item of data.Rooms" [value]="item.id">
                                {{ item.name }}
                            </mat-option>

                        </mat-select>
                        <mat-error *ngIf="PeriodForm.get('roomsIds')?.hasError('required')">
                            el estatus es requerido
                        </mat-error>
                    </mat-form-field>

                    <!--  -->
                </div>
                <div class="col-xl-12 col-lg-12 col-md-12col-sm-6 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Cantidad estudiantes</mat-label>
                        <input matInput formControlName="numOfStudents">
                        <mat-error *ngIf="PeriodForm.get('numOfStudents')?.hasError('required')">
                            Es requerido
                        </mat-error>
                    </mat-form-field>
                </div>
                <button mat-raised-button color="primary" [disabled]="!PeriodForm.valid"
                    (click)="submit()">Guardar</button>
            </div>
        </form>
    </div>
</div>
