<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="typeRequestForms" (ngSubmit)="submit">
            <div class="row">
            
                <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Tipo de Solicitud</mat-label>
                        <mat-select formControlName="requestType">
                            <mat-option *ngFor="let item of RequesttypeList" [value]="item.id"> {{
                                item.name}}</mat-option>
                        </mat-select>
                        <mat-error *ngIf="typeRequestForms.get('requestType')?.hasError('required')">
                            Es requerido
                        </mat-error>
                    </mat-form-field>

                </div>
                
                <div class=" col-xl-6 col-lg-6 col-md-6 col-sm-6 mb-2">
                    <mat-form-field class="example-full-width " appearance="outline">
                      <mat-label>rol</mat-label>
                      <mat-select formControlName="approvalRole" >
                        <mat-option *ngFor="let line of roleList"  [value]="line.id">{{line.name}}</mat-option>
                      </mat-select>
                      <mat-error *ngIf="typeRequestForms.get('approvalRole')?.hasError('required')">
                        el rol es requerido
                      </mat-error>
                    </mat-form-field>
                  </div>
    

            </div>

            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" [disabled]="!typeRequestForms.valid"
                            (click)="confirmAdd()">Guardar</button>
                        <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
