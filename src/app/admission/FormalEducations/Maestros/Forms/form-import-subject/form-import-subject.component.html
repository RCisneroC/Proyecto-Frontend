<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    {{dialogTitle}}
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-12">
          
            
            
          <div class="row">
           
            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
           
             
                <div class="example-button-row" style="text-align: right;">
                    <div class="export-button m-l-10" matTooltip="Descargar formato">
                        <img src="assets/images/icons/xlsx.png" alt=""
                            (click)="FormatoExcel()" />
                    </div>

                </div>
            </div>
            

          
     

         
        </div>
            <div class="row">
           
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
            
                    <app-file-upload (change)="onFileChange($event)"
                      ></app-file-upload>
                 

                 
                </div>
      
         

             
            </div>
            
         
            <div class="row" *ngIf="dataSource.length>0">
                <!-- <section class="table-container mat-elevation-z8" tabindex="0"> -->
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
         
                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="Linea">
                      <th mat-header-cell *matHeaderCellDef> Linea </th>
                      <td mat-cell *matCellDef="let element"> {{element.Linea}} </td>
                    </ng-container>
                    
                    
                    <ng-container matColumnDef="Nombre">
                        <th mat-header-cell *matHeaderCellDef> Nombre </th>
                        <td mat-cell *matCellDef="let element"> {{element.Nombre}} </td>
                      </ng-container>
                      
                      
                    <ng-container matColumnDef="Error">
                        <th mat-header-cell *matHeaderCellDef> Error </th>
                        <td mat-cell *matCellDef="let element" style="color: red;"> {{element.Error}} </td>
                      </ng-container>
                  
                    <tr mat-header-row *matHeaderRowDef="displayedColumns "></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>   
                  
                  </table>
               
                </div>
            <!-- </section> -->
            </div>
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                    <div class="example-button-row">
                        <button mat-raised-button color="primary" [disabled]="tempFile===undefined"
                            (click)="confirmAdd()">Guardar</button>
                        <button mat-raised-button color="warn" (click)="onNoClick()" tabindex="-1">Cancelar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
