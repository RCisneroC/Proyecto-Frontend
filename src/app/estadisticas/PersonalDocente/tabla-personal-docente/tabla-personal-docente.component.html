<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Docentes'" [items]="['Inicio','Estadísticas']" [active_item]="'Docentes'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header">
            Consulta de Información Docente
          </div>
          <div class="body">
            <!-- FILAS -->
            <div class="row">
              <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Filtros</mat-label>
                  <mat-select multiple>
                    <mat-option *ngFor="let row of lstFiltros" value="row.codigo">{{row.texto}}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
            <fieldset>
              <legend>Criterios de Búsqueda</legend>
              <div class="row">
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Lugar de Nacimiento</mat-label>
                    <input type="text" placeholder="Lugar de Nacimiento" aria-label="Lugar de Nacimiento" matInput
                      [matAutocomplete]="autoLugarNacimiento">
                      <mat-autocomplete #autoLugarNacimiento="matAutocomplete" [displayWith]="displayLugarNacimiento">
                      </mat-autocomplete>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Fecha de Nacimiento</mat-label>
                    <input matInput [matDatepicker]="fechaNacimiento">
                    <mat-datepicker-toggle matSuffix [for]="fechaNacimiento"></mat-datepicker-toggle>
                    <mat-datepicker #fechaNacimiento></mat-datepicker>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Lugar de Residencia</mat-label>
                    <input type="text" placeholder="Lugar de Residencia" aria-label="Lugar de Residencia" matInput
                      [matAutocomplete]="autoLugarResidencia">
                      <mat-autocomplete #autoLugarResidencia="matAutocomplete" [displayWith]="displayLugarResidencia">
                      </mat-autocomplete>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Cargos</mat-label>
                    <mat-select>
                      <mat-option></mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Nivel Educativo</mat-label>
                   <mat-select>
                      <mat-option></mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Título Obtenido</mat-label>
                      <input type="text" placeholder="Título Obtenido" aria-label="Título Obtenido" matInput
                      [matAutocomplete]="autoTituloObtenido">
                      <mat-autocomplete #autoTituloObtenido="matAutocomplete" [displayWith]="displayTituloObtenido">
                      </mat-autocomplete>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Materias Impartidas</mat-label>
                     <mat-select>
                      <mat-option></mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Tipo Educación</mat-label>
                    <mat-select>
                          <mat-option *ngFor="let row of lstTipoEducacion" value="row.codigo">{{row.texto}}</mat-option><mat-option></mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Sexo</mat-label>
                   <mat-select>
                      <mat-option *ngFor="let row of lstSexo" value="row.codigo">{{row.texto}}</mat-option><mat-option></mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Edad</mat-label>
                     <input only-number="true" type="text" placeholder="Edad" aria-label="Edad" matInput>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                  <mat-form-field class="example-full-width" appearance="outline">
                    <mat-label>Cédula</mat-label>
                    <input type="text" placeholder="Edad" aria-label="Cédula" matInput>
                  </mat-form-field>
                </div>
              </div>
            </fieldset>
            <!-- FIN FILAS-->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
