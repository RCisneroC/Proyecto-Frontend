<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Gráficas Docentes'" [items]="['Inicio','Estadísticas']"
        [active_item]="'Gráficas Docentes'">
      </app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header">
            Consulta de Gráfica del Docente
          </div>
          <div class="body">
            <!-- FILAS -->
            <form [formGroup]="form">
              <fieldset class="row">
                <legend>Criterios de Búsqueda</legend>
                <div class="row">
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Filtros</mat-label>
                      <mat-select multiple formControlName="filters">
                        <mat-option *ngFor="let row of lstFiltros" [value]="row.codigo">{{row.texto}}</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
                <div class="row">
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Fecha de Inicio</mat-label>
                      <input matInput formControlName="startDate" [matDatepicker]="TstartDate">
                      <mat-datepicker-toggle matSuffix [for]="TstartDate"></mat-datepicker-toggle>
                      <mat-datepicker #TstartDate></mat-datepicker>
                    </mat-form-field>
                  </div>
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                    <mat-form-field class="example-full-width" appearance="outline">
                      <mat-label>Fecha de Fin</mat-label>
                      <input matInput formControlName="plannedEndDate" [matDatepicker]="TplannedEndDate">
                      <mat-datepicker-toggle matSuffix [for]="TplannedEndDate"></mat-datepicker-toggle>
                      <mat-datepicker #TplannedEndDate></mat-datepicker>
                    </mat-form-field>
                  </div>

                </div>
              </fieldset>
            </form>
            <br />
            <button mat-raised-button color="primary" [disabled]="!form.valid" (click)="consultar()">
              <mat-icon>search</mat-icon>Buscar
            </button>
            <br />
            <br />
            <hr />
            <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
            <div class="card">
              <!-- INICIO GRAFICA-->
              <ng-container *ngIf="resultado !== undefined">
                <div class="row">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="lstTeacherEducatonLevel.length>0">
                    <div class="card">
                      <div class="header">
                        <h2>Nivel Educación</h2>
                      </div>
                      <div class="card-body">
                        <div style="height: 400px">
                          <ngx-charts-bar-vertical [results]="lstTeacherEducatonLevel" [gradient]="false" [xAxis]="true"
                            [yAxis]="true" [legend]="true" [showXAxisLabel]="true" [showYAxisLabel]="true"
                            [xAxisLabel]="'Nivel Educación'" [yAxisLabel]="'Cantidad'">
                          </ngx-charts-bar-vertical>
                        </div>
                      </div>
                    </div>
                  </div>


                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="lstteacherGroupedBySexo.length>0">
                    <div class="card">
                      <div class="header">
                        <h2>Sexo</h2>
                      </div>
                      <div class="card-body">
                        <div style="height: 400px">
                          <ngx-charts-bar-vertical [results]="lstteacherGroupedBySexo" [gradient]="false" [xAxis]="true"
                            [yAxis]="true" [legend]="true" [showXAxisLabel]="true" [showYAxisLabel]="true"
                            [xAxisLabel]="'Sexo'" [yAxisLabel]="'Cantidad'">
                          </ngx-charts-bar-vertical>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="lstteacherGroupedBySubject.length>0">
                    <div class="card">
                      <div class="header">
                        <h2>Materia Impartida</h2>
                      </div>
                      <div class="card-body">
                        <div style="height: 400px">
                          <ngx-charts-bar-vertical [results]="lstteacherGroupedBySubject" [gradient]="false"
                            [xAxis]="true" [yAxis]="true" [legend]="true" [showXAxisLabel]="true"
                            [showYAxisLabel]="true" [xAxisLabel]="'Materia Impartida'" [yAxisLabel]="'Cantidad'">
                          </ngx-charts-bar-vertical>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="lstteacherGroupedByActivity.length>0">
                    <div class="card">
                      <div class="header">
                        <h2>Actividad</h2>
                      </div>
                      <div class="card-body">
                        <div style="height: 400px">
                          <ngx-charts-bar-vertical [results]="lstteacherGroupedByActivity" [gradient]="false"
                            [xAxis]="true" [yAxis]="true" [legend]="true" [showXAxisLabel]="true"
                            [showYAxisLabel]="true" [xAxisLabel]="'Actividad'" [yAxisLabel]="'Cantidad'">
                          </ngx-charts-bar-vertical>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="lstteacherGroupedByProcess.length>0">
                    <div class="card">
                      <div class="header">
                        <h2>Tipo de Educación</h2>
                      </div>
                      <div class="card-body">
                        <div style="height: 400px">
                          <ngx-charts-bar-vertical [results]="lstteacherGroupedByProcess" [gradient]="false"
                            [xAxis]="true" [yAxis]="true" [legend]="true" [showXAxisLabel]="true"
                            [showYAxisLabel]="true" [xAxisLabel]="'Tipo de Educación'" [yAxisLabel]="'Cantidad'">
                          </ngx-charts-bar-vertical>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </ng-container>
              <!-- FIN GRAFICA-->
            </div>

          </div>
          <!-- FIN FILAS-->
        </div>
      </div>
    </div>
  </div>
</section>
