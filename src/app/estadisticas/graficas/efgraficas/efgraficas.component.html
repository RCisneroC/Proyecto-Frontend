<section class="content">
    <div class="content-block">
        <div class="block-header">
            <!-- breadcrumb -->
            <app-breadcrumb [title]="'Gráficas Carreras'" [items]="['Inicio','Estadísticas']"
                [active_item]="'Gráficas Carreras'">
            </app-breadcrumb>
        </div>
        <div class="row clearfix">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                <div class="card">
                    <div class="header">
                        Consulta de Gráfica de Carreras Entrenamiento
                    </div>
                    <div class="body">
                        <!-- FILAS -->
                        <form [formGroup]="form">
                            <fieldset class="row">
                                <legend>Criterios de Búsqueda</legend>
                                <div class="row">
                                    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Filtros</mat-label>
                                            <mat-select multiple formControlName="filters">
                                                <mat-option *ngFor="let row of lstFiltros"
                                                    [value]="row.codigo">{{row.texto}}</mat-option>
                                            </mat-select>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Fecha de Inicio</mat-label>
                                            <input matInput formControlName="startDate" [matDatepicker]="TstartDate">
                                            <mat-datepicker-toggle matSuffix [for]="TstartDate"></mat-datepicker-toggle>
                                            <mat-datepicker #TstartDate></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Fecha de Fin</mat-label>
                                            <input matInput formControlName="plannedEndDate"
                                                [matDatepicker]="TplannedEndDate">
                                            <mat-datepicker-toggle matSuffix
                                                [for]="TplannedEndDate"></mat-datepicker-toggle>
                                            <mat-datepicker #TplannedEndDate></mat-datepicker>
                                        </mat-form-field>
                                    </div>

                                </div>
                            </fieldset>
                        </form>
                        <br />
                        <button mat-raised-button color="primary" [disabled]="!form.valid" (click)="consultar()">
                            <mat-icon>search</mat-icon>Buscar
                        </button>
                        <br />
                        <br />
                        <hr />
                        <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
