<section class="content">
    <div class="content-block">
        <div class="block-header">
            <!-- breadcrumb -->
            <app-breadcrumb [title]="'Gráficas Matriculados'" [items]="['Inicio','Estadísticas']"
                [active_item]="'Gráficas Matriculados'">
            </app-breadcrumb>
        </div>
        <div class="row clearfix">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                <div class="card">
                    <div class="header">
                        Consulta de Gráfica de Matriculados
                    </div>
                    <div class="body">
                        <!-- FILAS -->
                        <form [formGroup]="form">
                            <fieldset class="row">
                                <legend>Criterios de Búsqueda</legend>
                                <div class="row">
                                    <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Filtros</mat-label>
                                            <mat-select multiple formControlName="filtros">
                                                <mat-option *ngFor="let row of lstFiltros"
                                                    [value]="row.codigo">{{row.texto}}</mat-option>
                                            </mat-select>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Fecha de Inicio</mat-label>
                                            <input matInput formControlName="startDate" [matDatepicker]="TstartDate">
                                            <mat-datepicker-toggle matSuffix [for]="TstartDate"></mat-datepicker-toggle>
                                            <mat-datepicker #TstartDate></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                    <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Fecha de Fin</mat-label>
                                            <input matInput formControlName="endDate" [matDatepicker]="TplannedEndDate">
                                            <mat-datepicker-toggle matSuffix
                                                [for]="TplannedEndDate"></mat-datepicker-toggle>
                                            <mat-datepicker #TplannedEndDate></mat-datepicker>
                                        </mat-form-field>
                                    </div>

                                </div>
                            </fieldset>
                        </form>
                        <br />
                        <button mat-raised-button color="primary" (click)="consultar()">
                            <mat-icon>search</mat-icon>Buscar
                        </button>
                        <!-- (click)="consultar()" -->
                        <!-- [disabled]="!form.valid" -->
                        <br />
                        <br />
                        <hr />
                        <mat-progress-bar mode="indeterminate" *ngIf="IsLoading"></mat-progress-bar>
                        <div class="card">
                            <ng-container *ngIf="resultado !== undefined">
                                <div class="row">
                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12"
                                        *ngIf="estudiantePorSexo.length>0">
                                        <div class="card">
                                            <div class="header">
                                                <h2>Matricula por Sexo</h2>
                                            </div>
                                            <div class="card-body">
                                                <div style="height: 400px">
                                                    <ngx-charts-bar-vertical [results]="estudiantePorSexo"
                                                        [gradient]="false" [xAxis]="true" [yAxis]="true" [legend]="true"
                                                        [showXAxisLabel]="true" [showYAxisLabel]="true"
                                                        [xAxisLabel]="'Matricula por Sexo'" [yAxisLabel]="'Cantidad'">
                                                    </ngx-charts-bar-vertical>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12"
                                        *ngIf="estudiantePorProvincia.length">
                                        <div class="card">
                                            <div class="header">
                                                <h2>Matricula por provincia</h2>
                                            </div>
                                            <div class="card-body">
                                                <div style="height: 400px">
                                                    <ngx-charts-bar-vertical [results]="estudiantePorProvincia"
                                                        [gradient]="false" [xAxis]="true" [yAxis]="true" [legend]="true"
                                                        [showXAxisLabel]="true" [showYAxisLabel]="true"
                                                        [xAxisLabel]="'Matricula por provincia'"
                                                        [yAxisLabel]="'Cantidad'">
                                                    </ngx-charts-bar-vertical>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="porPrograma.length>0">
                                        <div class="card">
                                            <div class="header">
                                                <h2>Matricula por Programa</h2>
                                            </div>
                                            <div class="card-body">
                                                <div style="height: 400px">
                                                    <ngx-charts-bar-vertical [results]="porPrograma" [gradient]="false"
                                                        [xAxis]="true" [yAxis]="true" [legend]="true"
                                                        [showXAxisLabel]="true" [showYAxisLabel]="true"
                                                        [xAxisLabel]="'Matricula por Programa'"
                                                        [yAxisLabel]="'Cantidad'">
                                                    </ngx-charts-bar-vertical>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12"
                                        *ngIf="estudiantePorEdad.length>0">
                                        <div class="card">
                                            <div class="header">
                                                <h2>Matricula por Edad</h2>
                                            </div>
                                            <div class="card-body">
                                                <div style="height: 400px">
                                                    <ngx-charts-bar-vertical [results]="estudiantePorEdad"
                                                        [gradient]="false" [xAxis]="true" [yAxis]="true" [legend]="true"
                                                        [showXAxisLabel]="true" [showYAxisLabel]="true"
                                                        [xAxisLabel]="'Matricula por Edad'" [yAxisLabel]="'Cantidad'">
                                                    </ngx-charts-bar-vertical>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </ng-container>
                            <!-- FIN GRAFICA-->
                        </div>

                    </div>
                    <!-- FIN FILAS-->
                </div>
            </div>
        </div>
    </div>
</section>
